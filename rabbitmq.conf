# Mounted into the rabbitmq container (see docker-compose.yml /
# docker-compose.prod.yml). Only overrides what's listed here; everything
# else uses RabbitMQ's defaults.

# RabbitMQ 3.8+ force-closes a channel if a delivered message isn't acked
# within this window ("PRECONDITION_FAILED - delivery acknowledgement ...
# timed out"). The default is 1800000 ms (30 minutes), which a CPU video
# swap job (especially with ENABLE_FACE_ENHANCER=true) can easily exceed —
# the swap itself keeps running in app/worker.py's background thread the
# whole time (see app/worker.py's threading note), it just can't ack until
# it's done. Raised generously here so long jobs aren't killed mid-swap.
consumer_timeout = 21600000
